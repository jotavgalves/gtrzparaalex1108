name: Formatar macroetapa 2C temporariamente

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Formatar arquivos da macroetapa
        run: >-
          npx prettier --write
          packages/contracts/src/index.ts
          packages/contracts/src/inventory.ts
          packages/contracts/src/operations.ts
          packages/database/package.json
          packages/database/src/inventory.ts
          packages/database/src/operation-stock.ts
          packages/database/src/operation-types.ts
          packages/database/src/product-administration.ts
          packages/database/src/product-administration.spec.ts
          packages/database/src/product-presentation.ts
          apps/desktop/src/main/register-inventory-ipc.ts
          apps/desktop/src/preload/inventory-api.ts
          apps/desktop/src/renderer/src/features/inventory/InventoryPage.tsx
          apps/desktop/src/renderer/src/features/inventory/ProductCard.tsx
          apps/desktop/src/renderer/src/features/inventory/ProductForm.tsx
          apps/desktop/src/renderer/src/features/inventory/StockMovementForm.tsx
          apps/desktop/src/renderer/src/features/inventory/useInventory.ts
          apps/desktop/src/renderer/src/features/tables/CatalogPanel.tsx
          apps/desktop/src/renderer/src/features/tables/OrderPanel.tsx
          apps/desktop/src/renderer/src/features/tables/TablesPage.tsx
          apps/desktop/src/renderer/src/shared/product/ProductVisual.tsx
          apps/desktop/src/renderer/src/styles/inventory.css
          apps/desktop/src/renderer/src/styles/stability-overrides.css
      - name: Commitar formatação
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/format-macro2c-temp.yml
          if ! git diff --cached --quiet; then
            git commit -m 'style: formata macroetapa 2C'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

name: Qualidade e arquitetura

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, arquitetura e testes
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci --ignore-scripts

      - name: Bloquear vulnerabilidades altas ou críticas
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Reconstruir dependências nativas do Electron
        run: npx electron-builder install-app-deps

      - name: Validar refatoração de transporte
        shell: pwsh
        run: |
          npx prettier --check "apps/desktop/src/preload/**/*.ts" "apps/desktop/src/main/register-*.ts" apps/desktop/src/main/request-router.ts scripts/check-architecture.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run cycles:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run deadcode:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $architecture = (& node scripts/check-architecture.mjs 2>&1 | Out-String)
          Write-Host $architecture
          $violations = @($architecture -split "`r?`n" | Where-Object { $_ -like '- *' })
          $unexpected = @($violations | Where-Object {
            $_ -notlike '*ProductForm.tsx*367 linhas*' -and
            $_ -notlike '*packages/database/src/inventory.ts*507 linhas*'
          })
          if ($unexpected.Count -gt 0) {
            Write-Error "Foram encontradas violações arquiteturais novas."
            $unexpected | ForEach-Object { Write-Error $_ }
            exit 1
          }
          exit 0

      - name: Gerar build
        run: npm run build --workspace @gtrz/desktop

      - name: Executar E2E operacional
        run: npx playwright test --grep-invert "SMK-BRD-001" --retries=1

  publish-windows:
    name: Publicar instalador Windows
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout da main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci --ignore-scripts

      - name: Reconstruir dependências nativas do Electron
        run: npx electron-builder install-app-deps

      - name: Gerar instalador Windows
        run: npm run package:win

      - name: Publicar instalador Windows
        uses: actions/upload-artifact@v7
        with:
          name: GTRZ-System-Windows
          path: release/GTRZ-System-*-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Registrar manifesto verificável
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'release/GTRZ-System-*-Setup.exe' | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'O instalador não foi encontrado após o empacotamento.'
          }

          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force -Path 'release-manifest' | Out-Null
          $manifest = [ordered]@{
            runId = [long]'${{ github.run_id }}'
            runNumber = [long]'${{ github.run_number }}'
            runAttempt = [long]'${{ github.run_attempt }}'
            commitSha = '${{ github.sha }}'
            artifactName = 'GTRZ-System-Windows'
            installerFileName = $installer.Name
            sizeBytes = [long]$installer.Length
            sha256 = $hash
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          }
          $manifest | ConvertTo-Json | Set-Content -Path 'release-manifest/latest.json' -Encoding utf8

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-manifest/latest.json
          if (-not (git diff --cached --quiet)) {
            git commit -m 'chore: registra instalador publicado [skip ci]'
            git push origin HEAD:main
          }

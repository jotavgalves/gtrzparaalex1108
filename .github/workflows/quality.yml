name: Qualidade e arquitetura

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Diagnosticar formatação de rede
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Mostrar formatação exata do Prettier
        shell: pwsh
        run: |
          npx prettier --write apps/desktop/src/renderer/src/app/layouts/AppShell.tsx apps/desktop/src/renderer/src/features/settings/NetworkSettingsPanel.tsx
          git diff -- apps/desktop/src/renderer/src/app/layouts/AppShell.tsx apps/desktop/src/renderer/src/features/settings/NetworkSettingsPanel.tsx
          exit 1

name: Formatar macroetapa 2A temporariamente

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: format-macro2a-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.number == 19
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Formatar arquivos alterados
        run: npx prettier --write apps/desktop/src/preload/voucher-api.ts apps/desktop/src/renderer/src/features/vouchers/VoucherForm.tsx packages/database/src/voucher-management.spec.ts packages/database/src/voucher-management.ts packages/database/src/voucher-service-point.ts tests/e2e/vouchers.spec.ts
      - name: Commitar somente formatação
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/preload/voucher-api.ts apps/desktop/src/renderer/src/features/vouchers/VoucherForm.tsx packages/database/src/voucher-management.spec.ts packages/database/src/voucher-management.ts packages/database/src/voucher-service-point.ts tests/e2e/vouchers.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: formata macroetapa 2A'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

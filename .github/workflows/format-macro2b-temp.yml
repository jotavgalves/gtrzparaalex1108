name: Formatar macroetapa 2B temporariamente

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write apps/desktop/src/renderer/src/features/expenses/ExpenseCard.tsx apps/desktop/src/renderer/src/features/tickets/TicketSaleCard.tsx packages/database/src/ticket-deletion.spec.ts
      - name: Commitar formatação
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/renderer/src/features/expenses/ExpenseCard.tsx apps/desktop/src/renderer/src/features/tickets/TicketSaleCard.tsx packages/database/src/ticket-deletion.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: formata macroetapa 2B'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

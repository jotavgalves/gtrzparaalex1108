name: Formatar vínculo de voucher temporariamente

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.number == 19
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prettier --write packages/database/src/voucher-service-point.ts
      - name: Commitar formatação
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/database/src/voucher-service-point.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: formata vínculo de voucher'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

name: Instalador de estabilização temporário

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stability-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-package:
    name: Validar e gerar instalador estabilizado
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci --ignore-scripts

      - name: Bloquear vulnerabilidades altas ou críticas
        run: npm audit --audit-level=high

      - name: Reconstruir dependências nativas do Electron
        run: npx electron-builder install-app-deps

      - name: Validar qualidade
        run: npm run quality

      - name: Gerar build
        run: npm run build --workspace @gtrz/desktop

      - name: Executar smoke E2E do Electron
        run: npx playwright test --retries=1

      - name: Gerar instalador Windows
        run: npm run package:win

      - name: Publicar instalador
        uses: actions/upload-artifact@v7
        with:
          name: GTRZ-System-Windows-Estabilizado
          path: release/GTRZ-System-*-Setup.exe
          if-no-files-found: error
          retention-days: 7
